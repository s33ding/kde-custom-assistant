services:
  web:
    build:
      context: app
      target: builder
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=iesb

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
